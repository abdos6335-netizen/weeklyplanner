name: Deploy Meeting AI Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/meeting-ai/**'
      - '.github/workflows/deploy-meeting-ai.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALLOWED_FIREBASE_UID: ${{ secrets.ALLOWED_FIREBASE_UID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/meeting-ai
          command: deploy
          secrets: |
            GROQ_API_KEY
            ALLOWED_FIREBASE_UID
