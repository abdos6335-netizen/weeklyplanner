name: Mobile Android validation

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'js/app.js'
      - 'js/store.js'
      - 'styles.css'
      - '.github/workflows/mobile-android.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'js/app.js'
      - 'js/store.js'
      - 'styles.css'
      - '.github/workflows/mobile-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate WeeklyPlanner web app JavaScript
        run: |
          # ES modules: check as modules, otherwise import-block mistakes pass silently.
          for f in js/*.js sw.js; do
            node --input-type=module --check < "$f" || { echo "Syntax error in $f"; exit 1; }
          done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS platform scaffolding
        run: bash mobile/tool/bootstrap_platforms.sh
      - name: Analyze Dart
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - name: Validate Google OAuth client configuration
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "ERROR: Repository variable GOOGLE_WEB_CLIENT_ID is missing or empty."
            exit 1
          fi
          if ! [[ "$GOOGLE_WEB_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "ERROR: GOOGLE_WEB_CLIENT_ID does not look like a Google OAuth client ID."
            exit 1
          fi
          echo "Google OAuth client ID is configured."
      - name: Build Android debug APK
        working-directory: mobile
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: flutter build apk --debug --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: weeklyplanner-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - name: Prepare release keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > mobile/android/key.properties
      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: mobile
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: flutter build apk --release --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      - name: Show release signing certificate fingerprint
        if: steps.signing.outputs.available == 'true'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weeklyplanner-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" mobile/android/key.properties
