name: Mobile Android validation

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS platform scaffolding
        run: bash mobile/tool/bootstrap_platforms.sh
      - name: Analyze Dart
        working-directory: mobile
        run: flutter analyze
      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --debug
