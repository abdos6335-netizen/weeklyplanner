name: Mobile Android validation

on:
  pull_request:
    paths:
      - 'mobile/**'\n      - 'js/app.js'
      - '.github/workflows/mobile-android.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS platform scaffolding
        run: bash mobile/tool/bootstrap_platforms.sh
      - name: Validate WeeklyPlanner web app JavaScript\n        run: node --check js/app.js\n      - name: Analyze Dart
        working-directory: mobile
        run: flutter analyze
      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: weeklyplanner-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
